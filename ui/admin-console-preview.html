<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Cloud Library 总控设计预览</title><style>body{margin:0;padding:12px;background:light-dark(#f3f6fa,#101923);color-scheme:light dark}button,input,select{font:inherit}</style></head><body>
<div id="emby-control-v6" aria-label="Cloud Library独立网页总控原型">
  <style>
    #emby-control-v6{--ec-bg:light-dark(#f3f6fa,#101923);--ec-panel:light-dark(#ffffff,#192737);--ec-ink:light-dark(#172d41,#e9f1f8);--ec-dim:light-dark(#52677b,#afc1d2);--ec-line:light-dark(#d7e2ec,#3c4f63);--ec-accent:light-dark(#126a9b,#85caf0);--ec-on:light-dark(#ffffff,#092438);--ec-soft:light-dark(#e5f2fa,#223e52);--ec-radius:12px;color:var(--ec-ink);font:400 14px/1.6 system-ui,"Microsoft YaHei",sans-serif;background:var(--ec-bg);border:1px solid var(--ec-line);border-radius:16px;overflow:hidden}
    #emby-control-v6 *{box-sizing:border-box}#emby-control-v6 h2,#emby-control-v6 h3,#emby-control-v6 p{margin:0}#emby-control-v6 h2{font-size:20px;font-weight:500}#emby-control-v6 h3{font-size:16px;font-weight:500}
    #emby-control-v6 header{padding:22px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap;background:var(--ec-panel);border-bottom:1px solid var(--ec-line)}
    #emby-control-v6 .ec-dim{font-size:12px;color:var(--ec-dim)}#emby-control-v6 .ec-tag{display:inline-block;padding:4px 8px;border-radius:6px;background:var(--ec-soft);font-size:12px}
    #emby-control-v6 .ec-shell{display:grid;grid-template-columns:170px minmax(0,1fr)}#emby-control-v6 nav{background:var(--ec-panel);padding:14px;border-right:1px solid var(--ec-line);display:flex;flex-direction:column;gap:7px;align-items:stretch}
    #emby-control-v6 button,#emby-control-v6 input,#emby-control-v6 select{font:inherit;color:var(--ec-ink);background:var(--ec-panel);border:1px solid var(--ec-line);border-radius:8px;min-height:44px;max-width:100%;padding:9px 12px}
    #emby-control-v6 button{font-weight:500;white-space:normal}#emby-control-v6 button[aria-pressed=true]{background:var(--ec-soft);color:var(--ec-accent)}#emby-control-v6 button.ec-primary{background:var(--ec-accent);color:var(--ec-on);border-color:transparent}#emby-control-v6 button:disabled{opacity:.5}
    #emby-control-v6 main{padding:22px;display:grid;gap:16px;align-content:start;min-width:0}#emby-control-v6 .ec-box{background:var(--ec-panel);border:1px solid var(--ec-line);border-radius:var(--ec-radius);padding:18px;min-width:0}
    #emby-control-v6 .ec-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#emby-control-v6 .ec-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
    #emby-control-v6 .ec-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}#emby-control-v6 label{display:grid;gap:5px;min-width:0}#emby-control-v6 input,#emby-control-v6 select{width:100%;min-width:0}#emby-control-v6 input[type=checkbox]{width:20px;min-height:20px;margin:0 8px 0 0;vertical-align:middle}
    #emby-control-v6 .ec-spaced{margin-top:12px}#emby-control-v6 .ec-line{padding:11px 0;border-bottom:1px solid var(--ec-line);overflow-wrap:anywhere}#emby-control-v6 .ec-line:last-child{border:0}
    #emby-control-v6 .ec-result{padding:14px;background:var(--ec-soft);border-radius:9px;margin-top:14px;overflow-wrap:anywhere}#emby-control-v6 .ec-result p+ p{margin-top:5px}#emby-control-v6 footer{padding:13px 22px;background:var(--ec-panel);border-top:1px solid var(--ec-line);font-size:12px;color:var(--ec-dim)}
    #emby-control-v6 .ec-compact .ec-box{padding:12px}
    @media(max-width:650px){#emby-control-v6 .ec-shell{grid-template-columns:1fr}#emby-control-v6 nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-right:0;border-bottom:1px solid var(--ec-line)}#emby-control-v6 main{padding:12px}#emby-control-v6 header{padding:16px}#emby-control-v6 .ec-grid{grid-template-columns:1fr}#emby-control-v6 .ec-box{padding:14px}}
  </style>
  <header><div><h2>Cloud Library · 独立网页总控</h2><p class="ec-dim">浏览器独立后台 · v8原型 · 24模块 · 不依赖Telegram</p></div><span class="ec-tag" id="ec-version">演示配置 v1 · 观察模式</span></header>
  <div class="ec-shell"><nav id="ec-nav" aria-label="总控导航"></nav><main id="ec-main"></main></div>
  <footer>所有发布、回放和审计均为本地演示；没有实际鉴权、执行器、防护或收款。正式功能按方案逐项实施与验收。</footer>
  <script>
  (()=>{
    const root=document.getElementById('emby-control-v6'),main=root.querySelector('#ec-main'),nav=root.querySelector('#ec-nav');
    const escape=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const box=html=>`<section class="ec-box">${html}</section>`;
    const action=(label,id,primary=false,disabled=false)=>`<button type="button" data-action="${id}" class="${primary?'ec-primary':''}" ${disabled?'disabled':''}>${label}</button>`;
    const modules=[
      ['overview','总览','数据更新时间（秒）','30','当前仅展示脱敏摘要，真实指标未接入'],
      ['users_roles','用户与角色','临时覆盖有效天数','7','独立角色、MFA、对象权限；不接受任意提权'],
      ['registration','注册邀请与队列','总成员名额','20','100码不等于100席；有界数据库队列、单开户worker、轮巡'],
      ['entitlements','权益保号','续期窗口（天）','30','A够300自动扣分/B有效30分钟，20天仅实际换方式冷却；免保号尾窗自愿'],
      ['points_codes','积分兑换码','月卡积分价','300','账本、目标余额、冻结和码核销分开'],
      ['catalog_promotions','商品活动','活动销售份额','5','定时优惠和已下单价格快照'],
      ['payments_fulfillment','核款履约','人工响应目标（小时）','24','本方真实到账＋MFA后单次码交付'],
      ['telegram_links','TG与外链','普通通知静默开始','22:00','购买外链当前Gate关闭，配置草稿见专页'],
      ['content_clients','帮助公告客户端','首页公告上限','3','版本化编辑，强拦截发布权限独立'],
      ['media','媒体追更','分享检查间隔（分钟）','20','唯一调度/元数据所有者，四阶段水位'],
      ['storage_routes','网盘播放线路','来源新签发并发','1','secret只写入引用，不回显Cookie'],
      ['devices_sessions','设备与会话','每用户同播路数','1','设备/HTTP连接/播放会话口径不同'],
      ['abuse_rules','媒体与TG防连点','媒体合并窗口（秒）','3','TG有独立身份/动作/失败预算与2秒合并，见TG防连点页'],
      ['abuse_events','安全事件','临时冷却（秒）','30','原因、期限、申诉和撤限；不永久自动封号'],
      ['capacity','资源人数同播','全服新播放上限','2','限额先预览，已有合法播放不被随机踢掉'],
      ['network_tls','域名IP证书','证书告警提前天数','14','域名控制权/TLS验证，裸IP默认关'],
      ['backup_migration','备份迁移','业务备份间隔（分钟）','60','加密快照/回执/恢复验证，禁双主'],
      ['external_points','游戏积分接口','来源日预算','500','默认关闭，验签/去重/预算/epoch'],
      ['system_releases','系统发布审计','观察时长（小时）','72','保存/期望/实际应用版本分别显示'],
      ['notifications','通知中心','投递重试次数','5','持久站内待办不依赖TG，支付秘密不进通知'],
      ['update_assistant','更新助手','检查间隔（小时）','6','程序仓库未创建，未配置不下载或应用'],
      ['jobs_observability','任务监控','全局重任务并发','1','更新/恢复/迁移/域名切换协调，取消有安全边界'],
      ['privacy_exports','隐私工单导出','短时下载有效分钟','5','本人导出、分级保留、账务与核销事实不能盲删'],
      ['secrets_adapters','凭据适配器','凭据到期告警天数','7','只写密钥引用，轮换、scope、能力与许可状态']
    ];
    const stored=window.openai?.widgetState?.privateContent;
    const tabs=[['retention','保号规则'],['security','防护策略'],['tg','TG防连点'],['sizing','资源调参'],['enrollment','注册排队'],['settings','全部设置'],['backup','备份与恢复'],['updates','更新助手'],['link','TG发电外链'],['events','安全事件'],['release','发布与审计']];
    const state={page:tabs.some(x=>x[0]===stored?.page)?stored.page:'security',raw:20,merge:3,unique:8,observe:true,version:1,applied:1,baseline:{raw:20,merge:3,unique:8,observe:true},result:'',error:'',confirmation:null,section:'registration',values:Object.fromEntries(modules.map(m=>[m[0],m[3]])),link:'',linkLabel:'发电',linkSaved:false,audit:[],blocked:true,updateMode:'CHECK_ONLY',tgRaw:20,tgMerge:2,tgFailures:5,tgResult:'',resourceMode:'RECOMMEND_MANUAL_APPLY',resourceProfile:'S',manualCache:16,approvedCacheMax:64,sizingResult:'',queueCount:100,queuePolicy:'BASE',queueResult:''};
    function remember(){window.openai?.setWidgetState?.({modelContent:{adminConsolePage:state.page},privateContent:{page:state.page}})?.catch(()=>{});}
    function security(){return box(`<div class="ec-row"><h3>防扫库与重复点击</h3><span class="ec-tag">${state.observe?'观察，不执行行为处罚':'执行候选限制'} · 演示</span></div><p class="ec-dim ec-spaced">鉴权和对象权限始终需要；行为阈值在真实客户端回放后才执行。</p><div class="ec-grid"><label>同集控制请求／10秒<input id="ec-raw" type="number" min="1" max="100" value="${state.raw}"></label><label>同上下文合并窗口／秒<input id="ec-merge" type="number" min="1" max="10" value="${state.merge}"></label><label>不同条目新签发／10分钟<input id="ec-unique" type="number" min="2" max="120" value="${state.unique}"></label><label>模式<select id="ec-observe"><option value="true" ${state.observe?'selected':''}>观察</option><option value="false" ${state.observe?'':'selected'}>执行候选（演示）</option></select></label></div><div class="ec-actions">${action('预览防护发布','preview-security',true)}</div>`)+box(`<h3>脱敏样例回放</h3><p class="ec-dim ec-spaced">只在本地计算，不向Emby或网盘发请求。假设同一合法上下文、无其他瓶颈。</p><div class="ec-actions">${action('同集连点100次','burst')}${action('不同剧集12次','scan')}${action('合法分片120次','segments')}${action('缓存后撤销权限','revoke')}</div>${state.result?`<div class="ec-result" role="status">${escape(state.result)}</div>`:''}`)+box(`<h3>数据请求单独保护</h3><p class="ec-spaced">Range拖动、字幕、HLS分片、心跳不按每次新开播计数；302签发后的CDN字节不全经过VPS。</p><p class="ec-dim ec-spaced">初始网关风控状态预算16MiB、10000键；实际部署与峰值待验证。</p>`);}
    function settings(){const m=modules.find(m=>m[0]===state.section);return box(`<h3>统一设置注册表 · 24个模块</h3><label class="ec-spaced">设置分组<select id="ec-section">${modules.map(x=>`<option value="${x[0]}" ${x[0]===state.section?'selected':''}>${x[1]}</option>`).join('')}</select></label><p class="ec-dim ec-spaced">全部功能的字段与操作清单见方案第25篇；这里每模块仅展示一个代表字段。真实表单、权限和执行器尚未实现。</p>`)+box(`<h3>${m[1]}</h3><p class="ec-spaced">${m[4]}</p><label class="ec-spaced">${m[2]}<input id="ec-setting-value" maxlength="80" value="${escape(state.values[m[0]])}"></label><p class="ec-dim ec-spaced">正式字段的类型、单位、范围、scope和应用目标由服务端校验；原型值不用于部署。</p><div class="ec-actions">${action('保存该字段演示草稿','save-setting',true)}</div>`);}
    function backup(){return box(`<div class="ec-row"><h3>备份、恢复与迁移</h3><span class="ec-tag">执行器未连接</span></div><p class="ec-spaced">本机一致备份与异地传输独立管理。升级调用同一备份服务；关闭异地接口不会关闭本机计划。</p><div class="ec-line">策略：每日完整配置／索引，有交易时每60分钟业务快照（设计初值）</div><div class="ec-line">保留：7日／4周／3月，受实际磁盘预算约束</div><div class="ec-line">异地推送与拉取：默认关闭；生成、加密校验、回执、恢复验证分别记录</div><div class="ec-actions">${action('预览备份流程','preview-backup',true)}${action('正式恢复（未实现）','restore',false,true)}</div>`)+box(`<h3>恢复前必须核对</h3><p class="ec-spaced">隔离环境、可解密快照、支付／claim／撤销最新水位、控制总额和新写入对账；恢复先停相关写入与收件者，防双主。</p><p class="ec-dim ec-spaced">这里没有生成或上传备份，RPO／RTO须真实演练后才能承诺。</p>`);}
    function updates(){const modes=[['OFF','关闭'],['CHECK_ONLY','只自动检查'],['AUTO_DOWNLOAD_MANUAL_APPLY','自动下载，手动应用'],['AUTO_APPLY_IN_WINDOW','维护窗口限定自动应用']];return box(`<div class="ec-row"><h3>更新助手</h3><span class="ec-tag">UNCONFIGURED · 未配置</span></div><p class="ec-spaced">程序仓库未创建；现有仓库仅存方案，不作为生产程序源。未配置时不发检查或下载请求。</p><div class="ec-line">实际程序版本／候选版本：未连接／无候选</div><div class="ec-line">可信仓库身份／签名根：待配置，执行器：未实现</div><label class="ec-spaced">未来自动化模式（仅演示草稿）<select id="ec-update-mode">${modes.map(([id,label])=>`<option value="${id}" ${id===state.updateMode?'selected':''}>${label}</option>`).join('')}</select></label><div class="ec-actions">${action('检查前置条件','check-update',true)}${action('应用更新（未就绪）','apply-update',false,true)}${action('程序回退（未就绪）','rollback-app',false,true)}</div>`)+box(`<h3>完整执行流程</h3><div class="ec-line">可信Release／精确commit → 验身份、签名与摘要 → 资源／兼容预检</div><div class="ec-line">变更互斥 → 排空写入 → 一致备份验证 → 维护应用 → 健康检查</div><div class="ec-line">观察／恢复任务 → 成功；失败仅在schema兼容时回退程序</div><p class="ec-spaced">程序回退、配置回滚、数据恢复分开；已有新订单／核销后，不自动恢复旧数据库。更新执行器独立于网页生命周期，并提供本地救援。</p><p class="ec-dim ec-spaced">2C2G拉CI预构建产物，允许短维护，不承诺零停机。只预览方案，不实际拉仓库。</p>`);}
    function retention(){return box(`<h3>v8 · 30天自动保号</h3><div class="ec-line">窗口30天、成功原到期＋30天，每窗最多一次；下一窗没开始不能连续续。</div><div class="ec-line">A：可用够300、明确授权后自动扣300；签到天数硬门槛0，显示本窗已签N天。</div><div class="ec-line">B：当前窗有效30分钟自动续30天，不扣积分；不是免保号卡。</div><div class="ec-line">真正首次选择／换A↔B后冷却20天；不换沿用、解锁权保留，实际换时即时生效。</div><div class="ec-line">免保号默认不参与；剩余严格不足30天才展示自愿启用，≥30天／永久隐藏。</div>`)+box(`<h3>正式配置与验收</h3><p class="ec-spaced">窗口／续期天数、A价格与授权上限、B采样／分钟、20天实际冷却、尾窗阈值／默认OFF、救济／迁移和版本化。不得把旧活动分阈值继续用于扣款。</p><p class="ec-spaced">手动免卡和A锁同一钱包／窗：旧预览冲突重看；续期不重置冷却，Emby失败不再扣钱。</p><p class="ec-dim ec-spaced">真实后端未实现；详细字段在retention示例与第29篇，用户进度／情景见独立TG原型。</p>`);}
    function tg(){return box(`<div class="ec-row"><h3>TG防连点与防爆破</h3><span class="ec-tag">设计 · 基础限额必须执行</span></div><p class="ec-spaced">真实TG身份跨命令／回调／Mini App共用预算；换callback ID、消息或页面也不重置。额外行为惩罚先观察，鉴权／幂等／有界资源始终要求。</p><div class="ec-grid"><label>原始动作上限／10秒<input id="ec-tg-raw" type="number" min="1" max="100" value="${state.tgRaw}"></label><label>同动作同对象合并／秒<input id="ec-tg-merge" type="number" min="1" max="10" value="${state.tgMerge}"></label><label>邀请码／兑码失败次数／10分钟<input id="ec-tg-failures" type="number" min="1" max="10" value="${state.tgFailures}"></label></div><div class="ec-line">初值：总60次／分，写3次／10秒、10次／分；单人最多1个在途写</div><div class="ec-line">失败冷却15分钟；安全码另按独立策略。缓存命中也先验证权限／epoch</div><div class="ec-actions">${action('回放100次同按钮','tg-burst',true)}</div>${state.tgResult?`<div class="ec-result" role="status">${escape(state.tgResult)}</div>`:''}`)+box(`<h3>回复和内存也有预算</h3><p class="ec-spaced">合并返回原操作，不每击发新消息。callback回应与普通发送分开，遵守实际429／retry_after；Webhook连接4、应用并发／收件箱各有限额。</p><p class="ec-dim ec-spaced">本页只演示原始动作＋语义幂等的局部计数，无真实限流／nonce验证；细节与生产用例见第28篇。</p>`);}
    function sizing(){const modes=[['MANUAL','手动'],['RECOMMEND_MANUAL_APPLY','自动推荐，手动应用'],['AUTO_BOUNDED','批准范围内自动']];const profiles=[['S','2GB · S'],['M','4GB · M'],['L','8GB · L'],['XL','16GB+ · XL']];return box(`<div class="ec-row"><h3>TG资源预算与自动调参</h3><span class="ec-tag">实际资源未连接</span></div><div class="ec-grid"><label>调参模式<select id="ec-resource-mode">${modes.map(([id,label])=>`<option value="${id}" ${id===state.resourceMode?'selected':''}>${label}</option>`).join('')}</select></label><label>假设有效内存（非硬件检测）<select id="ec-resource-profile">${profiles.map(([id,label])=>`<option value="${id}" ${id===state.resourceProfile?'selected':''}>${label}</option>`).join('')}</select></label><label>手动TG状态缓存／MiB<input id="ec-manual-cache" type="number" min="8" max="128" value="${state.manualCache}"></label><label>Owner允许自动缓存上限／MiB<input id="ec-cache-max" type="number" min="8" max="128" value="${state.approvedCacheMax}"></label></div><div class="ec-line">演示当前基线16MiB；默认推荐模式不自动改变已应用值</div><div class="ec-line">自动增长：稳定10分钟、每步最多25%，默认只调缓存与预取</div><div class="ec-line">队列自动增长：默认关，须磁盘与等待证据；worker自动增长：默认关，须CPU／DB／Emby／哈希证据</div><div class="ec-actions">${action('预览预算候选','preview-sizing',true)}</div>${state.sizingResult?`<div class="ec-result" role="status">${escape(state.sizingResult)}</div>`:''}`)+box(`<h3>每种模式都保留压力保护</h3><p class="ec-spaced">以宿主／容器适用限制中的较小值为准。可用&lt;256MiB或使用≥85%暂停新开户，恢复需≥384MiB且≤75%稳定120秒；缩队列不丢已收任务。</p><p class="ec-spaced">RAM升级不自动放宽点击／猜码频率、成员／每日／同播名额或Telegram发送限额；不自动扩大容器RAM和DB池。</p><p class="ec-dim ec-spaced">正式面板须显示保存／建议／desired／applied／压力保护值及逐项自动开关；本页仅代表字段与算例。</p>`);}
    function enrollment(){return box(`<div class="ec-row"><h3>高峰注册与轮巡队列</h3><span class="ec-tag">单worker · 设计回放</span></div><div class="ec-grid"><label>同时提交的不同身份数<input id="ec-queue-count" type="number" min="1" max="10000" value="${state.queueCount}"></label><label>算例名额策略<select id="ec-queue-policy"><option value="BASE" ${state.queuePolicy==='BASE'?'selected':''}>沿用20席／每日3（默认）</option><option value="APPROVED_100" ${state.queuePolicy==='APPROVED_100'?'selected':''}>假设已批准100席／每日100</option></select></label></div><div class="ec-line">S档未结上限256（含执行／退避／核实中）；2个预取引用、1个开户worker</div><div class="ec-line">批次轮巡、同批FIFO；等待日额／容量不占worker，每个身份仅1张原排队单</div><div class="ec-actions">${action('预览放号与队列','preview-queue',true)}</div>${state.queueResult?`<div class="ec-result" role="status">${escape(state.queueResult)}</div>`:''}`)+box(`<h3>正式注册工作台</h3><p class="ec-spaced">应显示资格／席位预留型批次、已售未兑预留、排队／活跃／等日额／等容量／结果不明、最老等待、吞吐、暂停／恢复／对账。</p><p class="ec-spaced">重复提交返回原ticket；进度建议20秒带抖动，最短15秒。创建超时先核实，不盲重试；数据库故障不转同步无限开户。</p><p class="ec-dim ec-spaced">发100码不自动改成员／日额／同播。这里不接入数据库、不调用Emby，也未测实际内存或完成时间。</p>`);}
    function link(){return box(`<div class="ec-row"><h3>TG发电／购买外链</h3><span class="ec-tag">有效关闭 · 规则待确认</span></div><p class="ec-spaced">技术上可做普通URL按钮；交付注册码、续期码或白名单时仍是购买。</p><div class="ec-grid"><label>草稿按钮名<input id="ec-link-label" maxlength="20" value="${escape(state.linkLabel)}"></label><label>草稿HTTPS地址<input id="ec-link-url" type="url" value="${escape(state.link)}" placeholder="https://shop.example.com"></label></div><div class="ec-actions">${action('保存外链演示草稿','save-link',true)}${action('尝试发布（检查Gate）','publish-link')}</div><p class="ec-dim ec-spaced">2026-11-18官方核验未确认豁免；本轮不会打开网址，Owner勾选不等于平台许可。独立网址人工告知方案保留。</p>`)+box(`<h3>发布前的条件</h3><div class="ec-line">域名控制权、HTTPS与目的地校验</div><div class="ec-line">商品／渠道实际就绪，链接不含身份、码或secret</div><div class="ec-line">具体平台适用证据复核；当前尚未满足</div>`);}
    function events(){return box(`<h3>安全事件 · 虚构样例</h3><div class="ec-line">E-DEMO-1 · U10001 · 同集重复控制请求 · 观察命中</div><div class="ec-line">动作：候选30秒新开播冷却，已有合法流不随机终止</div><div class="ec-line">原始IP、Token和完整播放URL未展示</div><div class="ec-actions">${action(state.blocked?'预览撤销示例限制':'示例已撤限','unblock',false,!state.blocked)}</div>`)+box(`<h3>误伤处理</h3><p class="ec-spaced">先查规则、路由与客户端回放；临时例外写明范围、原因和到期。真实撤令牌不能保证收回已签发的上游302。</p>`);}
    function release(){return box(`<h3>配置应用状态</h3><div class="ec-line">演示期望版本 v${state.version} · 演示应用版本 v${state.applied}</div><div class="ec-line">真实执行器：未连接，不代表VPS已应用</div><div class="ec-actions">${action('演示回滚防护配置','rollback',false,state.version===1)}</div>`)+box(`<h3>本地演示审计</h3>${state.audit.length?state.audit.map(x=>`<div class="ec-line">${escape(x)}</div>`).join(''):'<p class="ec-dim ec-spaced">尚无演示操作。正式审计来自后端，不由浏览器自报。</p>'}`);}
    function render(){
      root.querySelector('#ec-version').textContent=`演示配置 v${state.applied} · ${state.baseline.observe?'观察模式':'候选执行'}`;
      nav.innerHTML=tabs.map(([id,name])=>`<button type="button" data-page="${id}" aria-pressed="${state.page===id}">${name}</button>`).join('');
      const page={retention,security,tg,sizing,enrollment,settings,backup,updates,link,events,release}[state.page];
      main.innerHTML=page()+(state.confirmation?box(`<div role="dialog" aria-label="防护配置发布确认"><h3>确认演示发布</h3><p class="ec-spaced">原始请求 ${state.raw}/10秒，合并${state.merge}秒，不同条目${state.unique}/10分钟；${state.observe?'观察':'候选执行'}。只改变本地演示。</p><p class="ec-dim ec-spaced">正式提交需expected_version、原因、MFA和执行器回执。</p><div class="ec-actions">${action('取消','cancel')}${action('确认演示发布','confirm-security',true)}</div></div>`):'')+(state.error?`<div class="ec-result" role="alert">${escape(state.error)}</div>`:'');
    }
    function valid(){return Number.isInteger(state.raw)&&state.raw>=1&&state.raw<=100&&Number.isInteger(state.merge)&&state.merge>=1&&state.merge<=10&&Number.isInteger(state.unique)&&state.unique>=2&&state.unique<=120;}
    root.addEventListener('input',e=>{const ids={'ec-raw':'raw','ec-merge':'merge','ec-unique':'unique','ec-tg-raw':'tgRaw','ec-tg-merge':'tgMerge','ec-tg-failures':'tgFailures','ec-manual-cache':'manualCache','ec-cache-max':'approvedCacheMax','ec-queue-count':'queueCount'};if(ids[e.target.id])state[ids[e.target.id]]=e.target.value===''?NaN:Number(e.target.value);if(e.target.id==='ec-setting-value')state.values[state.section]=e.target.value;if(e.target.id==='ec-link-url')state.link=e.target.value;if(e.target.id==='ec-link-label')state.linkLabel=e.target.value;});
    root.addEventListener('change',e=>{if(e.target.id==='ec-observe')state.observe=e.target.value==='true';const selectMap={'ec-resource-mode':'resourceMode','ec-resource-profile':'resourceProfile','ec-queue-policy':'queuePolicy'};if(selectMap[e.target.id]){state[selectMap[e.target.id]]=e.target.value;state.error='';state.sizingResult='';state.queueResult='';render();}if(e.target.id==='ec-update-mode'){state.updateMode=e.target.value;state.error='仅调整演示草稿；程序仓库未配置、有效更新保持关闭。';render();}if(e.target.id==='ec-section'){state.section=e.target.value;state.error='';render();}});
    root.addEventListener('click',e=>{
      const b=e.target.closest('button');if(!b||b.disabled)return;
      if(b.dataset.page){state.page=b.dataset.page;state.confirmation=null;state.error='';render();remember();return;}
      const a=b.dataset.action;state.error='';
      if(['preview-security','burst','scan'].includes(a)&&!valid()){state.error='请填写有效整数：请求1～100，合并1～10秒，条目2～120。';render();return;}
      if(a==='preview-security')state.confirmation={base:state.version,draft:JSON.stringify([state.raw,state.merge,state.unique,state.observe])};
      else if(a==='cancel')state.confirmation=null;
      else if(a==='confirm-security'){
        if(!state.confirmation||state.confirmation.base!==state.version||state.confirmation.draft!==JSON.stringify([state.raw,state.merge,state.unique,state.observe])){state.error='演示版本或草稿已变化，请重新预览。';state.confirmation=null;}
        else{state.version++;state.applied=state.version;state.baseline={raw:state.raw,merge:state.merge,unique:state.unique,observe:state.observe};state.audit.unshift(`v${state.version} · 防护演示发布 · 实际VPS未变`);state.confirmation=null;}
      }
      else if(a==='burst'){const n=Math.min(100,state.raw);state.result=`候选执行回放：100次同毫秒控制请求 → 1次新签发、${n-1}次授权复用、${100-n}次短限流。当前${state.observe?'观察模式仅记录，不表示真实拒绝':'候选执行模式也仅本地演示'}。`;}
      else if(a==='scan'){const n=Math.min(12,state.unique);state.result=`只看不同条目规则：12次 → ${n}个候选允许，${12-n}个候选限流；新开播／来源预算在真实网关继续检查。当前为本地回放。`;}
      else if(a==='segments')state.result='120次合法分片属于已有播放：新增开播0、新签发0；真实数据速率/令牌/会话预算仍需执行。';
      else if(a==='revoke')state.result='先验证撤销epoch和对象权限：缓存即使命中，也拒绝新授权。已有上游302不能保证即时收回。';
      else if(a==='save-setting'){if(!state.values[state.section].trim())state.error='演示字段不能为空。';else{state.audit.unshift(`${state.section} · 保存演示草稿，尚未应用`);state.error='该模块演示草稿已保存；未改变真实配置。';}}
      else if(a==='preview-backup'){state.error='设计流程：生成一致快照 → 加密与控制总额校验 → 可选异地回执 → 隔离恢复验证。未生成任何文件或执行恢复。';state.audit.unshift('预览备份流程 · 无真实任务');}
      else if(a==='check-update'){state.error='UNCONFIGURED：程序仓库未创建／未配置，执行器未实现；未发请求、未下载、未改变程序或数据。';state.audit.unshift('更新前置检查 · 程序源未配置，停止');}
      else if(a==='tg-burst'){if(!Number.isInteger(state.tgRaw)||state.tgRaw<1||state.tgRaw>100||!Number.isInteger(state.tgMerge)||state.tgMerge<1||state.tgMerge>10||!Number.isInteger(state.tgFailures)||state.tgFailures<1||state.tgFailures>10){state.error='请填整数：原始1～100、合并1～10秒、失败1～10次。';}else{const n=Math.min(100,state.tgRaw);state.tgResult=`局部候选回放：100次同时间同语义点击 → 1笔新写、${n-1}次合并、${100-n}次原始限频；换callback ID不换身份。实际业务约束／其他预算仍需后端验证。`;}}
      else if(a==='preview-sizing'){if(![state.manualCache,state.approvedCacheMax].every(x=>Number.isInteger(x)&&x>=8&&x<=128)){state.error='缓存和自动上限需为8～128MiB整数。';}else{const suggested={S:16,M:32,L:64,XL:128}[state.resourceProfile];const candidate=state.resourceMode==='MANUAL'?state.manualCache:state.resourceMode==='AUTO_BOUNDED'?Math.min(suggested,state.approvedCacheMax,20):16;state.sizingResult=`当前16MiB；档位建议${suggested}MiB；本次候选${candidate}MiB。${state.resourceMode==='RECOMMEND_MANUAL_APPLY'?'推荐模式保持原值，需管理员确认。':state.resourceMode==='AUTO_BOUNDED'?'假设证据／窗口已满足，仅在Owner上限内调缓存，每步≤25%。':'手动候选也需校验后发布。'}开户worker仍1，点击频率仍20／10秒；无真实应用。`;}}
      else if(a==='preview-queue'){if(!Number.isInteger(state.queueCount)||state.queueCount<1||state.queueCount>10000){state.error='提交人数需为1～10000整数。';}else{const accepted=Math.min(state.queueCount,256),success=Math.min(accepted,state.queuePolicy==='BASE'?3:100);state.queueResult=`无故障简化算例：${accepted}个意向可入队，${state.queueCount-accepted}个队满稍后重试；按所选策略当日最多${success}人成功，${accepted-success}人仍等待。始终仅1个开户worker／2个预取引用；发码不自动升额，无真实开户或耗时承诺。`;}}
      else if(a==='save-link'){try{const url=new URL(state.link);if(url.protocol!=='https:'||url.hostname!=='shop.example.com'||url.username||url.password||url.search||url.hash)throw new Error();state.linkSaved=true;state.audit.unshift('TG外链 · 已存演示草稿，规则Gate关闭');state.error='演示草稿已存。实际域名控制权和规则适用尚未确认，有效开关仍关闭。';}catch{state.error='演示仅接受 https://shop.example.com，无身份、query或片段。不会打开网址。';}}
      else if(a==='publish-link'){state.error='POLICY_REVIEW_REQUIRED：当前规则适用未确认，拒绝发布外链；用户端保持无购买链接。';state.audit.unshift('TG外链发布被Gate阻止 · 无真实操作');}
      else if(a==='unblock'){state.blocked=false;state.audit.unshift('E-DEMO-1 · 演示撤限 · 实际用户未变');}
      else if(a==='rollback'){state.raw=20;state.merge=3;state.unique=8;state.observe=true;state.version++;state.applied=state.version;state.baseline={raw:20,merge:3,unique:8,observe:true};state.audit.unshift(`v${state.version} · 演示回滚到初始规则 · 账本未恢复`);}
      render();remember();
    });
    window.addEventListener('openai:set_globals',event=>{const p=event.detail?.globals?.widgetState?.privateContent?.page;if(tabs.some(x=>x[0]===p)&&p!==state.page){state.page=p;state.error='';state.confirmation=null;render();}});
    render();
    if(globalThis.Tweak){const design={radius:12};const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--ec-radius',design.radius+'px')});tweak.addSlider(design,'radius',{label:'面板圆角',min:4,max:18,unit:'px'});}
  })();
  </script>
</div>
</body></html>
