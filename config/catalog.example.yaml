    sales_limit_total: 3
    purchase_limit_per_uid: 1
    eligibility: [PURCHASE_REGISTRATION_PATH_OPEN, MEMBER_CAPACITY_RESERVED, NOT_YET_REGISTERED]
    effect: {type: REGISTER_AND_EXEMPT_PLAYBACK, duration_days: 365, includes_registration: true}
  - sku: RENEW_30D_CODE
    title: 30天续期码
    enabled: false
    entrypoint: STANDALONE_WEB
    price: {unit: CNY_FEN, amount: null}
    delivery: SINGLE_USE_CODE
    sales_limit_total: 20
    eligibility: [EXISTING_MEMBER, FUTURE_CAPACITY_CHECKED]
    effect: {type: EXEMPT_PLAYBACK, duration_days: 30, includes_registration: false}
