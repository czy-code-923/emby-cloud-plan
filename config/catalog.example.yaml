    title: 月注册码（注册并开通30天免保号播放）
    enabled: false
    entrypoint: STANDALONE_WEB
    price: {unit: CNY_FEN, amount: null}
    delivery: SINGLE_USE_CODE
    sales_limit_total: 5
    purchase_limit_per_uid: 1
    eligibility: [PURCHASE_REGISTRATION_PATH_OPEN, MEMBER_CAPACITY_RESERVED, NOT_YET_REGISTERED]
