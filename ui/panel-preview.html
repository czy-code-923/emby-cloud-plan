<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>CloudBot面板设计预览</title><style>html{color-scheme:light dark}body{margin:0;background:light-dark(#f4f6fa,#101823)}</style></head><body>
<div id="cloud-panel-v4" class="viz-dotted-background">
  <style>
    #cloud-panel-v4{--cl-bg:light-dark(#f3f6fa,#101823);--cl-surface:light-dark(#ffffff,#192637);--cl-text:light-dark(#13283b,#e9f1fa);--cl-muted:light-dark(#52677b,#acbed0);--cl-line:light-dark(#dbe5ee,#34465a);--cl-blue:light-dark(#126ba4,#75c6f7);--cl-onblue:light-dark(#ffffff,#092235);--cl-soft:light-dark(#e9f3fc,#223c53);--cl-radius:18px;color:var(--cl-text);font:400 14px/1.6 system-ui,"Microsoft YaHei",sans-serif;padding:18px 8px;box-sizing:border-box}
    #cloud-panel-v4 *{box-sizing:border-box}
    #cloud-panel-v4 .cl-shell{max-width:440px;margin:auto;background:var(--cl-bg);border:1px solid var(--cl-line);border-radius:24px;overflow:hidden}
    #cloud-panel-v4 .cl-preview{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:11px 16px;background:var(--cl-surface);color:var(--cl-muted);font-size:12px;border-bottom:1px solid var(--cl-line)}
    #cloud-panel-v4 select,#cloud-panel-v4 input{font:inherit;color:var(--cl-text);background:var(--cl-surface);border:1px solid var(--cl-line);border-radius:10px;padding:9px;max-width:100%;min-height:44px}
    #cloud-panel-v4 .cl-head{padding:20px 18px 13px;display:flex;align-items:center;gap:12px}
    #cloud-panel-v4 .cl-logo{background:var(--cl-blue);color:var(--cl-onblue);border-radius:14px;width:42px;height:42px;display:grid;place-items:center;font-size:22px;font-weight:500}
    #cloud-panel-v4 h2,#cloud-panel-v4 h3,#cloud-panel-v4 p{margin:0}
    #cloud-panel-v4 h2{font-size:18px;font-weight:500}#cloud-panel-v4 h3{font-size:15px;font-weight:500}
    #cloud-panel-v4 .cl-small{font-size:12px;color:var(--cl-muted)}
    #cloud-panel-v4 .cl-content{padding:0 16px 16px;min-height:470px;display:grid;gap:12px;align-content:start}
    #cloud-panel-v4 .cl-box{border:1px solid var(--cl-line);border-radius:var(--cl-radius);background:var(--cl-surface);padding:16px;min-width:0}
    #cloud-panel-v4 .cl-feature{background:var(--cl-soft);border-color:transparent}
    #cloud-panel-v4 .cl-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    #cloud-panel-v4 .cl-stack{display:grid;gap:10px}#cloud-panel-v4 .cl-gap{margin-top:12px}
    #cloud-panel-v4 .cl-value{font-size:28px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.8px}
    #cloud-panel-v4 .cl-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    #cloud-panel-v4 .cl-tag{display:inline-block;border-radius:7px;background:var(--cl-soft);padding:3px 7px;font-size:12px;color:var(--cl-text)}
    #cloud-panel-v4 button{font:inherit;font-weight:500;min-height:44px;border:1px solid var(--cl-line);background:var(--cl-surface);color:var(--cl-text);padding:10px 12px;border-radius:11px;max-width:100%}
    #cloud-panel-v4 button.cl-primary{background:var(--cl-blue);color:var(--cl-onblue);border-color:transparent}
    #cloud-panel-v4 button:disabled{opacity:.55;cursor:default}
    #cloud-panel-v4 .cl-full{width:100%}
    #cloud-panel-v4 .cl-bar{height:7px;background:var(--cl-bg);border-radius:5px;overflow:hidden;margin:10px 0}
    #cloud-panel-v4 .cl-bar span{display:block;height:100%;background:var(--cl-blue);border-radius:5px}
    #cloud-panel-v4 .cl-list{padding:11px 0;border-bottom:1px solid var(--cl-line)}#cloud-panel-v4 .cl-list:last-child{border:0;padding-bottom:0}
    #cloud-panel-v4 .cl-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:8px 7px 12px;background:var(--cl-surface);border-top:1px solid var(--cl-line)}
    #cloud-panel-v4 .cl-nav button{border:0;padding:9px 2px;border-radius:10px;font-size:12px;font-weight:400;background:transparent}
    #cloud-panel-v4 .cl-nav button[aria-pressed=true]{background:var(--cl-soft);color:var(--cl-blue);font-weight:500}
    #cloud-panel-v4 .cl-notice{padding:10px 16px;background:var(--cl-surface);font-size:12px;color:var(--cl-muted);border-top:1px solid var(--cl-line)}
    #cloud-panel-v4 label{display:grid;gap:6px}#cloud-panel-v4 input[type=range]{width:100%;padding:0;accent-color:var(--cl-blue)}
    #cloud-panel-v4 .cl-receipt{color:var(--cl-text);padding:10px 12px;border-radius:10px;background:var(--cl-soft)}
    #cloud-panel-v4 .cl-caption{font-size:12px;color:var(--cl-muted);margin-top:5px}
    #cloud-panel-v4.cl-compact .cl-box{padding:12px}#cloud-panel-v4.cl-compact .cl-content{gap:9px}
    @media(max-width:360px){#cloud-panel-v4{padding:8px 0}#cloud-panel-v4 .cl-content{padding:0 10px 12px}#cloud-panel-v4 .cl-box{padding:13px}#cloud-panel-v4 .cl-preview{padding:9px 12px}}
  </style>
  <section class="cl-shell" aria-label="CloudBot面板设计预览">
    <div class="cl-preview"><span>TG面板 · v8演示</span><label>预览身份<select id="cl-role" aria-label="预览身份"><option value="user">用户</option><option value="admin">管理快捷（受限）</option></select></label><label>设计页切换（非Bot功能）<select id="cl-surface" aria-label="预览入口"><option value="telegram">TG面板</option><option value="standalone">独立网页商店</option></select></label></div>
    <header class="cl-head"><div class="cl-logo" aria-hidden="true">C</div><div><h2>Cloud Library · TG面板</h2><div class="cl-small" id="cl-subtitle">你的个人影音空间</div></div></header>
    <main id="cl-content" class="cl-content"></main>
    <nav id="cl-nav" class="cl-nav" aria-label="面板导航"></nav>
    <div class="cl-notice" role="status" id="cl-status">TG自助与受限快捷原型；全部设置由独立网页总控管理。</div>
  </section>
  <script>
  (()=>{
    const root=document.getElementById('cloud-panel-v4');
    const saved=window.openai?.widgetState?.privateContent||{};
    const state={role:saved.role==='admin'?'admin':'user',page:'home',balance:284,signed:false,exempt:false,confirm:false,now:19,end:30,exemptUntil:0,mode:'CHECKIN_POINTS',participating:true,aConsent:true,nextSwitch:20,windowSigned:19,previousSigned:null,watchMinutes:0,scenario:'A',modeConfirm:null,cardPreview:null,settledEnds:new Set(),receipt:'',target:'284',reason:'',capacity:2,compact:false,surface:'telegram',manualOrder:'none',codeSource:'PURCHASE',reviewConfirm:false,websku:'renew30',orderSku:null,orderChannel:null,codeUsed:false,channels:['ALIPAY_RED_PACKET_MANUAL'],chosenChannel:'ALIPAY_RED_PACKET_MANUAL',announcement:'使用前请查看客户端与播放帮助；当前服务处于设计阶段。',announcementDraft:'使用前请查看客户端与播放帮助；当前服务处于设计阶段。',externalPoints:false,remoteBackup:false};
    const content=root.querySelector('#cl-content'),nav=root.querySelector('#cl-nav'),role=root.querySelector('#cl-role');
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const primary=(label,action,disabled=false)=>`<button class="cl-primary cl-full" type="button" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`;
    const box=html=>`<section class="cl-box">${html}</section>`;
    const row=(a,b)=>`<div class="cl-row"><span>${a}</span><span>${b}</span></div>`;
    const label=(a,b)=>`<div class="cl-small">${a}</div><div class="cl-value">${b}</div>`;
    const go=(text,page)=>`<button type="button" data-action="go" data-page="${page}">${text}</button>`;
    function estimate(r){const e=Array(Math.max(0,r)+1).fill(0);for(let n=1;n<=r;n++){let s=0;for(let x=10;x<=20;x++)s+=e[Math.max(0,n-x)];e[n]=1+s/11;}return e[Math.max(0,r)].toFixed(1);}
    const demoProducts={renew30:{title:'30天续期码',days:30,price:12,stock:20},renew365:{title:'365天续期码',days:365,price:108,stock:5},whitelist:{title:'365天免活动白名单',days:365,price:108,stock:2}};
    const channelNames={ALIPAY_RED_PACKET_MANUAL:'支付宝口令红包',ALIPAY_QR_MANUAL:'支付宝收款码',WECHAT_QR_MANUAL:'微信收款码'};
    const baseDate=Date.UTC(2026,10,18,16);
    const dateOf=day=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(baseDate+day*86400000));
    const isExempt=()=>state.now<state.exemptUntil;
    const modeName=()=>state.mode==='CHECKIN_POINTS'?'A · 签到积分':state.mode==='WATCH'?'B · 观影':'未选择';
    const canSelect=()=>!isExempt()||(state.end-state.now>0&&state.end-state.now<30);
    function scenario(id){
      const common={signed:false,confirm:false,modeConfirm:null,previousSigned:null,settledEnds:new Set(),receipt:'',scenario:id};
      const cases={A:{now:19,end:30,exemptUntil:0,mode:'CHECKIN_POINTS',participating:true,aConsent:true,nextSwitch:20,windowSigned:19,balance:284,watchMinutes:0},FUNDED:{now:1,end:30,exemptUntil:0,mode:'CHECKIN_POINTS',participating:true,aConsent:true,nextSwitch:20,windowSigned:0,balance:300,watchMinutes:0},B:{now:10,end:30,exemptUntil:0,mode:'WATCH',participating:true,aConsent:false,nextSwitch:20,windowSigned:4,balance:100,watchMinutes:29},LONG:{now:0,end:60,exemptUntil:60,mode:null,participating:false,aConsent:false,nextSwitch:0,windowSigned:0,balance:284,watchMinutes:0},EXACT:{now:0,end:30,exemptUntil:30,mode:null,participating:false,aConsent:false,nextSwitch:0,windowSigned:0,balance:284,watchMinutes:0},TAIL:{now:20,end:30,exemptUntil:30,mode:null,participating:false,aConsent:false,nextSwitch:0,windowSigned:10,balance:300,watchMinutes:30},UNLOCKED:{now:35,end:60,exemptUntil:0,mode:'CHECKIN_POINTS',participating:true,aConsent:true,nextSwitch:20,windowSigned:5,balance:100,watchMinutes:30}};
      Object.assign(state,common,cases[id]||cases.A);state.exempt=isExempt();
    }
    function maybeRenew(){
      if(!state.participating)return '未启用保号，不自动扣款。';
      if(state.now<state.end-30)return '下一30天窗口尚未开始，不再扣款或重复用观影。';
      if(state.now>=state.end)return '已到期；补救需另行确认，不后台追扣。';
      if(state.settledEnds.has(state.end))return '本窗已结算。';
      if(state.mode==='CHECKIN_POINTS'&&(!state.aConsent||state.balance<300))return state.aConsent?'余额不足300，保留当前到期。':'A自动扣款未授权。';
      if(state.mode==='WATCH'&&state.watchMinutes<30)return '本窗有效观影尚不足30分钟。';
      const old=state.end;if(state.mode==='CHECKIN_POINTS')state.balance-=300;
      state.settledEnds.add(old);state.end=old+30;state.previousSigned=state.windowSigned;state.windowSigned=0;state.watchMinutes=0;
      return `演示自动${state.mode==='CHECKIN_POINTS'?'扣300积分':'免费观影'}续期：${dateOf(old)} → ${dateOf(state.end)}；余额${state.balance}，仍是活动保号。下一窗从${dateOf(old)}开始。`;
    }
    function activateExempt(days){state.end=Math.max(state.now,state.end)+days;state.exemptUntil=state.end;state.exempt=true;state.participating=false;state.aConsent=false;state.windowSigned=0;state.watchMinutes=0;}
    function retentionPage(){
      const examples=[['A','A：已签19天，284分'],['FUNDED','A：已有300分，未签到'],['B','B：已看29分钟'],['LONG','免保号还剩60天'],['EXACT','免保号恰好30天'],['TAIL','免保号尾窗剩10天'],['UNLOCKED','D35仍保留D20重选权']];
      const future=state.now<state.end-30,unlocked=state.now>=state.nextSwitch;
      const selectors=canSelect()?`<div class="cl-grid cl-gap">${primary(state.mode==='CHECKIN_POINTS'?'继续/启用A':'选择A · 同意自动扣300','choose-a',state.mode!=='CHECKIN_POINTS'&&state.mode!==null&&!unlocked)}${primary(state.mode==='WATCH'?'继续/启用B':'选择B · 观影30分钟','choose-b',state.mode!=='WATCH'&&state.mode!==null&&!unlocked)}</div>`:'<p class="cl-gap">当前免保号剩余≥30天，隐藏保号选择；不用保号，可正常签到。</p>';
      return box(`<h3>30天保号与方式选择</h3><label class="cl-gap">设计情景（仅本地预览）<select id="cl-retention-scenario">${examples.map(([id,name])=>`<option value="${id}" ${id===state.scenario?'selected':''}>${name}</option>`).join('')}</select></label><div class="cl-list">${row('当前权益',isExempt()?'免保号':'活动保号')}</div><div class="cl-list">${row('播放截止',dateOf(state.end))}</div><div class="cl-list">${row('剩余时长',(state.end-state.now)+'天（示例）')}</div><div class="cl-list">${row('当前方式',modeName())}</div><div class="cl-list">${row('保号参与',state.participating?'已启用':'默认/当前关闭')}</div>`)+box(`<h3>当前续期窗口</h3><p class="cl-gap">${dateOf(state.end-30)} ～ ${dateOf(state.end)}（结束不含）</p><p class="cl-caption">${future?'下一窗尚未开始；上窗已结，不重复扣款/观影。':'30天准确窗口；已签天数是实际日期数，不设20次硬门槛。'}</p><div class="cl-grid cl-gap"><div>${label('本窗已签到',state.windowSigned+'天')}</div><div>${label('可用积分',state.balance)}</div></div><div class="cl-list">${row('本窗有效观影',state.watchMinutes+' / 30分钟')}</div><div class="cl-list">${row('A自动扣分',state.participating&&state.aConsent?'已同意300分/续30天':'未授权/参与关闭')}</div>${state.previousSigned!==null?`<p class="cl-caption">上一已结窗口签到${state.previousSigned}天，历史不因换窗消失。</p>`:''}<div class="cl-grid cl-gap">${go('每日签到','checkin')}${primary('评估当前窗口','evaluate-retention')}${primary('模拟新增1分钟观影','watch-minute')}${primary('模拟时间前进1天','advance-day')}</div>`)+box(`<h3>方式冷却独立计算</h3><p class="cl-gap">${unlocked?'重选已解锁，权利保留到实际更换；之后重新冷却20天。':'可在'+dateOf(state.nextSwitch)+'后更换，还需'+(state.nextSwitch-state.now)+'天。'}</p><p class="cl-caption">同方式确认、自动续期、买卡不重置；换方式即时生效，不改窗口/到期。免保号尾窗自愿启用，不取消原时长。</p>${selectors}<div class="cl-gap">${primary('暂停保号/撤回A自动授权','pause-retention',!state.participating)}</div>`);
    }
    function helpPage(){return box(`<h3>使用帮助与公告</h3><p class="cl-gap">${esc(state.announcement)}</p><p class="cl-caption">演示公告 · 后台可版本化编辑</p>`)+box(`<h3>开始播放</h3><div class="cl-list">1. 复制本人有权访问的服务器地址，使用Emby账号登录。</div><div class="cl-list">2. 优先使用客户端可直接解码的视频与外置字幕；本档位不做实时视频转码。</div><div class="cl-list">3. 无法播放时提交条目与错误引用号，不发送完整Token或密码。</div>`)+box(`<h3>客户端与禁用说明</h3><p class="cl-gap">当前没有配置实际禁用名单。</p><p class="cl-caption">正式清单写明版本、原因、替代建议和是否已执行拦截；客户端名称可被伪造，业务白名单不绕过安全策略。</p>`)+box(`<h3>兑换码与支持</h3><p class="cl-gap">允许来源的码：查看效果 → 明确确认 → 一次核销 → 权益同步。</p><p class="cl-caption">本面板没有现金购买入口，也不接收支付秘密。</p><div class="cl-gap">${go(state.surface==='telegram'?'查看权益与核销':'查看本人订单','orders')}</div>`);}
    function orderPage(){
      const status={none:'暂无演示现金订单',review:'人工待核款',issued:'兑换码已发 · 未核销',claimed:'已核销 · 演示权益已记录'}[state.manualOrder];
      const item=state.orderSku?demoProducts[state.orderSku]:null;
      const tg=state.surface==='telegram';
      const blocked=tg&&state.codeSource!=='ADMIN_GIFT';
      const heading=tg?box(`<h3>本人权益与核销状态</h3><p class="cl-gap">${state.manualOrder==='claimed'?'权益已记录':state.manualOrder==='issued'?'演示码待处理':'暂无已核销演示权益'}</p>${item?`<p class="cl-caption">${esc(item.title)} · ${item.days}天 · 单次 · 本人绑定</p>`:''}`):box(`<h3>我的网页订单与兑换码</h3><p class="cl-gap">${status}</p>${item?`<div class="cl-list">${esc(item.title)} · 演示¥${item.price.toFixed(2)}</div><p class="cl-caption">${esc(channelNames[state.orderChannel])} · 本人UID绑定 · 单次使用</p>`:''}`);
      const code=(state.manualOrder==='issued'||state.manualOrder==='claimed')?box(`<h3>虚构码演示</h3><p class="cl-gap">DEMO-ONLY-ONCE</p><p class="cl-caption">${blocked?'此来源的TG核销暂未启用；本页不提供购买或跳转。':'不是真实码。时长从核销起算/续期顺延。'}</p><div class="cl-gap">${primary(state.codeUsed?'已核销，不重复增加时长':blocked?'此来源暂不支持TG核销':'核销演示单次码','claim-demo',state.codeUsed||blocked)}</div>`):box(`<p>${tg?'只展示允许来源的码和本人权益；本面板不提供现金购买。':state.manualOrder==='review'?'用户声称付款不等于到账；等待管理员核对。':'暂无网页演示订单。'}</p>`);
      return heading+code;
    }
    function standaloneShop(){
      const p=demoProducts[state.websku];
      return box(`<h3>独立网页商店 · 演示</h3><p class="cl-caption">正式价格未设，真实收款未开放。此页与TG内结账分开。</p>`)+box(`<h3>注册商品</h3><p class="cl-gap">月注册：资格＋30天；年注册：资格＋365天。</p><p class="cl-caption">仅未开通访客可购买，分别限量；本示例用户已有账号，请选续期。未兑注册码也占预留名额。</p>`)+box(`<label>商品<select id="cl-websku">${Object.entries(demoProducts).map(([id,x])=>`<option value="${id}" ${state.websku===id?'selected':''}>${x.title}</option>`).join('')}</select></label><div class="cl-row cl-gap"><h3>演示¥${p.price.toFixed(2)}</h3><span class="cl-tag">演示份额 ${p.stock}</span></div><p class="cl-caption">免签到、免观影；不增加同播。核款后发${p.days}天单次码，码未兑不开始计时。</p><label class="cl-gap">付款渠道<select id="cl-payment-channel" ${state.channels.length?'':'disabled'}>${state.channels.length?state.channels.map(id=>`<option value="${id}" ${state.chosenChannel===id?'selected':''}>${channelNames[id]}</option>`).join(''):'<option>所有渠道暂停</option>'}</select></label><p class="cl-caption">管理员可多选启用渠道，每单只选一种。这里不展示真实二维码、不收口令。</p><div class="cl-gap">${primary(state.manualOrder!=='none'?'已有演示订单，查看状态':state.channels.length?'模拟提交付款申请':'现金购买暂停',state.manualOrder!=='none'?'go-orders':'submit-manual',!state.channels.length&&state.manualOrder==='none')}</div>`)+box(`<h3>确认后发货</h3><p class="cl-gap">提交申请只到待核；管理员核实本方实际到账，再发购买UID绑定的一次性码。</p><p class="cl-caption">正式调价、限时优惠、份额与手动停售见方案；已付款快照不随下架改变。</p>`);
    }
    function manualReview(){
      if(state.manualOrder!=='review')return box(`<h3>人工核款待办</h3><p class="cl-gap">${state.manualOrder==='none'?'尚无演示付款申请。':'本单已核准，重复操作不会再发码。'}</p><p class="cl-caption">切换独立网页提交演示申请后，管理员在这里预览核款。</p>`);
      const item=demoProducts[state.orderSku];

    function render(){
      role.value=state.role;root.querySelector('#cl-surface').value=state.surface;root.classList.toggle('cl-compact',state.compact);

      content.innerHTML=pageExtras()+(state.role==='admin'?adminPage():userPage())+(state.confirm?box(`<div role="dialog" aria-label="月卡兑换确认"><h3>确认兑换月卡</h3><p class="cl-gap">演示扣300分：${state.cardPreview?.balance??state.balance} → ${(state.cardPreview?.balance??state.balance)-300}</p><p>新增30天，保留当前剩余并免签到/观影；旧到期${dateOf(state.end)} → ${dateOf(Math.max(state.now,state.end)+30)}，原同播不变。</p><div class="cl-grid cl-gap"><button type="button" data-action="cancel">取消</button><button class="cl-primary" type="button" data-action="confirm">确认演示兑换</button></div></div>`):'')+(state.modeConfirm?box(`<div role="dialog" aria-label="保号方式确认"><h3>确认${state.modeConfirm==='CHECKIN_POINTS'?'A自动扣款授权':'B观影保号'}</h3><p class="cl-gap">${state.modeConfirm==='CHECKIN_POINTS'?'当前30天窗够300自动扣300，原到期＋30天，结果是活动时长。':'当前窗有效观影30分钟免费自动续30天。'}真正变更后冷却20天，相同方式不重置。</p><div class="cl-grid cl-gap"><button type="button" data-action="cancel-mode">取消</button><button type="button" data-action="confirm-mode">确认方式与授权</button></div></div>`):'')+(state.reviewConfirm?box(`<div role="dialog" aria-label="人工核款确认"><h3>演示核款确认</h3><p class="cl-gap">正式需要真实到账引用与MFA；本次不领取红包、不发真实消息。</p><div class="cl-grid cl-gap"><button type="button" data-action="cancel-review">取消</button><button class="cl-primary" type="button" data-action="approve-demo">确认演示发单次码</button></div></div>`):'')+(state.receipt?`<div class="cl-receipt" role="status" aria-live="polite">${esc(state.receipt)}</div>`:'');
      const pages=state.role==='admin'?[['home','总览'],['users','用户'],['tasks','任务'],['capacity','容量'],['settings','设置']]:[['home','首页'],['media','追更'],['checkin','签到'],['shop',state.surface==='telegram'?'兑换':'商店'],['mine','我的']];
      nav.innerHTML=pages.map(([p,n])=>`<button type="button" data-action="go" data-page="${p}" aria-pressed="${state.page===p}">${n}</button>`).join('');

    function remember(){window.openai?.setWidgetState?.({modelContent:{panelPreviewRole:state.role,panelPreviewPage:state.page},privateContent:{role:state.role}})?.catch(()=>{});}
    role.addEventListener('change',()=>{state.role=role.value;state.page='home';state.confirm=false;state.reviewConfirm=false;state.receipt='';render();remember();});
    root.addEventListener('input',e=>{if(e.target.id==='cl-announcement')state.announcementDraft=e.target.value;if(e.target.matches('.cl-channel-toggle')){state.channels=e.target.checked?[...new Set([...state.channels,e.target.value])]:state.channels.filter(id=>id!==e.target.value);if(!state.channels.includes(state.chosenChannel))state.chosenChannel=state.channels[0]||'';}if(e.target.id==='cl-target')state.target=e.target.value;if(e.target.id==='cl-reason')state.reason=e.target.value;if(e.target.id==='cl-cap'){root.querySelector('#cl-cap-value').textContent=e.target.value+'路';root.querySelector('#cl-cap-hint').textContent=Number(e.target.value)<2?'已有2路将保持；暂停新增直到低于新上限。':'限制新播放准入；不代表已验证承载能力。';}});
    root.querySelector('#cl-surface').addEventListener('change',e=>{state.surface=e.target.value;state.page=state.role==='admin'?'settings':'shop';state.confirm=false;state.reviewConfirm=false;state.receipt='';render();remember();});
    root.addEventListener('change',e=>{if(e.target.id==='cl-retention-scenario'){scenario(e.target.value);render();}if(e.target.id==='cl-websku'){state.websku=e.target.value;render();}if(e.target.id==='cl-payment-channel')state.chosenChannel=e.target.value;});
    root.addEventListener('click',e=>{
      const button=e.target.closest('[data-action]');if(!button||button.disabled)return;const a=button.dataset.action;state.receipt='';
      if(a==='go'){state.page=button.dataset.page;state.confirm=false;state.reviewConfirm=false;state.modeConfirm=null;}
      else if(a==='go-checkin'){state.page='checkin';}
      else if(a==='checkin'&&!state.signed){state.signed=true;state.balance+=16;if(state.now>=state.end-30&&state.now<state.end)state.windowSigned++;state.receipt='演示今日＋16分；'+maybeRenew();}
      else if(a==='redeem'){state.confirm=true;state.cardPreview={balance:state.balance,end:state.end};}
      else if(a==='cancel'){state.confirm=false;}
      else if(a==='confirm'){if(!state.cardPreview||state.cardPreview.balance!==state.balance||state.cardPreview.end!==state.end){state.receipt='预览版本已变化，请重新查看余额/到期后确认，未再次扣款。';}else if(state.balance<300){state.receipt='余额不足，未扣款。';}else{state.balance-=300;activateExempt(30);state.receipt='演示兑换：保留原剩余，新加30天免保号，播放至'+dateOf(state.end)+'；参与暂停，实际变更冷却保留。';}state.confirm=false;state.cardPreview=null;}
      else if(a==='mode'){state.page='keep';}
      else if(a==='choose-a'||a==='choose-b'){const target=a==='choose-a'?'CHECKIN_POINTS':'WATCH';if(!canSelect())state.receipt='免保号剩余≥30天，选择入口尚未开放。';else if(state.mode!==null&&target!==state.mode&&state.now<state.nextSwitch)state.receipt='还在20天实际变更冷却，不能提前换。';else state.modeConfirm=target;}
      else if(a==='cancel-mode'){state.modeConfirm=null;}
      else if(a==='confirm-mode'&&state.modeConfirm){const target=state.modeConfirm;if(state.mode!==target){state.nextSwitch=state.now+20;state.mode=target;}state.participating=true;state.aConsent=target==='CHECKIN_POINTS';state.modeConfirm=null;state.receipt='已演示明确选择；'+maybeRenew();}
      else if(a==='pause-retention'){state.participating=false;state.aConsent=false;state.receipt='已演示撤回未提交扣款授权；方式/重选时间保留，不改变已生效时长。';}
      else if(a==='evaluate-retention'){state.receipt=maybeRenew();}
      else if(a==='watch-minute'){if(state.now>=state.end-30&&state.now<state.end)state.watchMinutes++;state.receipt='演示新增一分钟已验证观影；'+maybeRenew();}
      else if(a==='advance-day'){state.now++;state.signed=false;state.receipt='演示前进一天；'+maybeRenew();}
      else if(a==='adjust-preview'){const target=Number(root.querySelector('#cl-target').value);const reason=root.querySelector('#cl-reason').value.trim();state.receipt=(!Number.isInteger(target)||target<0||target>100000)?'请输入0～100000的整数。':!reason?'请填写调整原因。':`仅预览：可用积分${state.balance} → ${target}，差额${target-state.balance}；正式提交需再次验证。`;}
      else if(a==='capacity-preview'){const value=Number(root.querySelector('#cl-cap').value);state.capacity=value;state.receipt=`仅演示配置为${value}路。`+(value<2?'已有2路保持，暂停新增。':'仍需后端准入与容量验证。');}

      else if(a==='backup'){state.receipt='正式面板分预检、加密备份、校验、隔离恢复和切换；本演示不执行。';}
      else if(a==='security'){state.receipt='正式敏感操作通过HTTPS验证安全码/管理员MFA；演示不收集任何凭据。';}
      else if(a==='devices'){state.receipt='示例：电视、手机已授权2台，设备上限3台，同播上限1路。';}
      else if(a==='orders'||a==='go-orders'){state.page='orders';}
      else if(a==='other-product'){state.receipt='示例余额不足；季卡850分、年卡3000分，均免活动考核。';}
      if(a==='submit-manual'&&state.manualOrder==='none'&&state.channels.length){state.manualOrder='review';state.orderSku=state.websku;state.orderChannel=state.chosenChannel||state.channels[0];state.receipt='演示：已建人工待核款；通知仅作本地模拟，尚未实际收款。';}
      else if(a==='review-preview'&&state.role==='admin'&&state.manualOrder==='review'){state.reviewConfirm=true;}
      else if(a==='cancel-review'){state.reviewConfirm=false;}
      else if(a==='approve-demo'&&state.role==='admin'&&state.manualOrder==='review'){state.manualOrder='issued';state.reviewConfirm=false;state.receipt='演示：核准后仅发一枚单次码，未核销前时长未开始。';}
      else if(a==='claim-demo'&&state.manualOrder==='issued'&&!state.codeUsed&&(state.surface==='standalone'||state.codeSource==='ADMIN_GIFT')){state.codeUsed=true;state.manualOrder='claimed';activateExempt(demoProducts[state.orderSku].days);state.receipt='演示核销成功：'+demoProducts[state.orderSku].days+'天免活动播放，重复点击不会增加时长。';}
      else if(a==='publish-announcement'&&state.role==='admin'){if(state.announcementDraft.trim()){state.announcement=state.announcementDraft.trim();state.receipt='演示公告已发布；可切用户首页查看。';}else state.receipt='公告不能为空。';}
      else if(a==='toggle-points'&&state.role==='admin'){state.externalPoints=!state.externalPoints;state.receipt='仅切换演示标识；正式关接口须在最终入账前核对开关与epoch。';}
      else if(a==='toggle-backup'&&state.role==='admin'){state.remoteBackup=!state.remoteBackup;state.receipt='仅切换演示标识；正式关闭会停止新传输并撤销旧下载票据。';}
      render();remember();
    });
    window.addEventListener('openai:set_globals',event=>{const incoming=event.detail?.globals?.widgetState?.privateContent;if((incoming?.role==='user'||incoming?.role==='admin')&&incoming.role!==state.role){state.role=incoming.role;state.page='home';state.confirm=false;state.receipt='';render();}});
    render();
    if(globalThis.Tweak){const design={radius:18,compact:false};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--cl-radius',design.radius+'px');state.compact=design.compact;render();}});tweak.addSlider(design,'radius',{label:'卡片圆角',min:10,max:24,unit:'px'});tweak.addToggle(design,'compact',{label:'紧凑布局'});}
  })();
  </script>
</div>
</body></html>
