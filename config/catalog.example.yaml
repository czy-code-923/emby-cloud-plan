  - sku: DATA_RETENTION_90D
    title: 仅账号资料保留90天（无播放）
    enabled: false
    entrypoint: STANDALONE_WEB
    delivery: SINGLE_USE_CODE
    price: {unit: CNY_FEN, amount: null}
