# v5.2设计示例；独立网页售卖，TG不提供链接；Stars SKU仅停用历史候选。
schema_version: 6
catalog_version: proposal-v6-2026-11-18
defaults:
  quantity_per_order: 1
  points_delivery: DIRECT_GRANT
  cash_delivery: SINGLE_USE_CODE
  cash_code_max_claims: 1
  cash_code_bound_to_purchaser: true
  code_claim_valid_days: 30
  code_duration_starts_at: CLAIM_COMMIT
  unpublish_revokes_sold_codes: false
  hard_capacity_check_required: true
  promotions_overlap: REJECT
products:
  - sku: EXEMPT_PLAY_30D_POINTS
    title: 积分月卡（30天免保号播放）
    enabled: true
    price: {unit: POINTS, amount: 300}
    effect: {type: EXEMPT_PLAYBACK, duration_days: 30, checkin_required: false, watch_required: false}
    stacking: APPEND_CONTIGUOUS_SAME_TIER
  - sku: EXEMPT_PLAY_90D_POINTS
    title: 积分季卡（90天免保号播放）
    enabled: true
    price: {unit: POINTS, amount: 850}
    effect: {type: EXEMPT_PLAYBACK, duration_days: 90, checkin_required: false, watch_required: false}
    stacking: APPEND_CONTIGUOUS_SAME_TIER
  - sku: EXEMPT_PLAY_365D_POINTS
    title: 积分年卡（365天免保号播放）
    enabled: true
    price: {unit: POINTS, amount: 3000}
    effect: {type: EXEMPT_PLAYBACK, duration_days: 365, checkin_required: false, watch_required: false}
    stacking: APPEND_CONTIGUOUS_SAME_TIER
  - sku: EXEMPT_PLAY_30D_STARS
    title: 播放月卡（30天免保号）
    enabled: false
    entrypoint: TELEGRAM
    delivery: DIRECT_GRANT
    price: {unit: XTR, amount: null}
    effect: {type: EXEMPT_PLAYBACK, duration_days: 30, registered_devices: 3, concurrent_streams: 1}
