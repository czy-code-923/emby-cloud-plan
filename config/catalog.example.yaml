    title: 播放年卡（365天免保号）
    enabled: false
    entrypoint: TELEGRAM
    delivery: DIRECT_GRANT
    price: {unit: XTR, amount: null}
    effect: {type: EXEMPT_PLAYBACK, duration_days: 365, registered_devices: 3, concurrent_streams: 1}
