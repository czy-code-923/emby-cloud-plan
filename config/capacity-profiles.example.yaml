# 资源档位初值；不是压测结果，不代表可售并发；按cgroup有效资源识别。
schema_version: 7
recommendation:
  observation_hours: 72
  evidence_required_for_sales_capacity: true
  automatic_limit_increase: false
  automatic_destructive_cleanup: false
  scope: EFFECTIVE_HOST_OR_CONTAINER
  automatic_limit_increase_scope: MEMBERS_SALES_PLAYBACK_AND_SECURITY_THRESHOLDS
profiles:
  XS:
    min_memory_mib: 1024
    min_effective_cpus: 1
    complete_single_host_stack_recommended: false
    bootstrap_stream_limit: 1
    heavy_workers: 1
    video_transcoding: false
  S:
    min_memory_mib: 2048
    min_effective_cpus: 2
    bootstrap_stream_limit: 2
    heavy_workers: 1
    postgres_pool: 4
    video_transcoding: false
  M:
    min_memory_mib: 4096
    min_effective_cpus: 2
    bootstrap_stream_limit: 3
    heavy_workers: 2
    postgres_pool: 6
    video_transcoding: false
  L:
    min_memory_mib: 8192
    min_effective_cpus: 4
    bootstrap_stream_limit: 6
    heavy_workers: 2
    postgres_pool: 8
    video_transcoding: false
  XL:
    min_memory_mib: 16384
    min_effective_cpus: 8
    bootstrap_stream_limit: 10
    heavy_workers: 4
    postgres_pool: 12
    video_transcoding: false # 识别GPU后仍需单独测试，不能自动开启
limits:
  registered_members: 20
  active_members: 20
  registration_daily: 3
  global_concurrent_streams: 2
  per_user_concurrent_streams: 1
  playback_starts_per_user_per_day: null
  per_user_registered_devices: 3
  video_transcode_processes: 0
  proxy_traffic_monthly_gb: null # 未知值不猜；由供应商计费口径确定
  node_limits: []
  storage_account_limits: []
semantics:
  null_limit: UNLIMITED
  unknown_measurement: ABSENT_VALUE_WITH_UNKNOWN_STATUS
  zero_limit: DENY
  lowering_limit: APPLY_TO_NEW_ADMISSIONS
  keep_existing_sessions_by_default: true
  permit_individual_override_above_global_hard_limit: false
telegram_workload:
  runtime_implemented: false
  mode: RECOMMEND_MANUAL_APPLY
  supported_modes: [MANUAL, RECOMMEND_MANUAL_APPLY, AUTO_BOUNDED]
  effective_resource_scope_and_timestamp_visible: true
  show_saved_recommended_desired_applied_and_protective_values: true
  initial_profile: S
  profiles:
    XS: {state_cache_mib: 8, maximum_state_keys: 5000, reply_cache_mib: 4, inbox_outstanding: 64, registration_outstanding: 128, prefetch_refs: 1, recommended_provisioning_workers: 1, hash_concurrency: 1, full_stack_recommended: false}
    S: {state_cache_mib: 16, maximum_state_keys: 10000, reply_cache_mib: 8, inbox_outstanding: 128, registration_outstanding: 256, prefetch_refs: 2, recommended_provisioning_workers: 1, hash_concurrency: 1}
    M: {state_cache_mib: 32, maximum_state_keys: 20000, reply_cache_mib: 16, inbox_outstanding: 256, registration_outstanding: 512, prefetch_refs: 4, recommended_provisioning_workers: 2, hash_concurrency: 1}
    L: {state_cache_mib: 64, maximum_state_keys: 40000, reply_cache_mib: 32, inbox_outstanding: 512, registration_outstanding: 1024, prefetch_refs: 4, recommended_provisioning_workers: 2, hash_concurrency: 2}
    XL: {state_cache_mib: 128, maximum_state_keys: 80000, reply_cache_mib: 64, inbox_outstanding: 1024, registration_outstanding: 2048, prefetch_refs: 8, recommended_provisioning_workers: 4, hash_concurrency: 2}
  auto_bounded:
    enabled: false
    owner_preapproved_ceiling_required: true
    initially_auto_tunable: [STATE_CACHE_BYTES, REPLY_CACHE_BYTES, PREFETCH_REFS]
    queue_capacity_auto_increase_opt_in: false
    provisioning_worker_auto_increase_opt_in: false
    hash_concurrency_auto_increase_opt_in: false
    member_daily_sales_playback_security_or_telegram_egress_auto_increase: false
    min_max_current_and_reason_visible: true
    effective_memory_is_min_of_applicable_host_and_cgroup_limits: true
    resource_unknown_blocks_increase: true
    memory_growth_requires_unused_budget_after_real_stack_peak: true
    stable_before_growth_minutes: 10
    growth_step_percent_maximum: 25
    minimum_interval_between_growth_minutes: 10
    forced_shrink_or_pause_may_be_immediate: true
    queue_growth_requires_database_disk_and_backlog_age_evidence: true
    worker_growth_requires_cpu_emby_latency_pool_and_hash_budget_evidence: true
    container_memory_or_db_pool_automatically_expanded: false
    preserve_cooldowns_nonces_idempotency_and_claim_facts_during_resize: true
    lowering_queue_cap_drops_already_admitted_tickets: false
  pressure_guard:
    enabled_by_design_in_all_modes: true
    contract: registration-queue.example.yaml
    manual_mode_disables_safety_pause: false
    runtime_implemented: false
  memory_accounting:
    tg_state_and_reply_caches_are_separate_from_media_gateway_cache: true
    byte_cap_before_key_count: true
    configured_key_count_is_guaranteed_fit: false
    queue_records_are_durable_not_resident_tasks: true
    budget_includes_rss_db_hash_parse_buffers_and_media_peaks: true
