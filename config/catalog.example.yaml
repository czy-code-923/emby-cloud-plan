    title: 额外授权设备1台30天（不增加同播）
    enabled: false
    price: {unit: POINTS, amount: null}
    eligibility: [ACTIVE_PLAYBACK_ENTITLEMENT, HARD_DEVICE_ADMISSION_VERIFIED]
    effect: {type: ADDITIONAL_DEVICE_QUOTA, count: 1, duration_days: 30, additional_streams: 0}
  - sku: EXTRA_STREAM_30D
    title: 额外同播1路30天
    enabled: false
    entrypoint: STANDALONE_WEB
    delivery: SINGLE_USE_CODE
    price: {unit: CNY_FEN, amount: null}
    eligibility: [HARD_CONCURRENCY_ADMISSION_VERIFIED, GLOBAL_AND_NODE_CAPACITY_RESERVED]
