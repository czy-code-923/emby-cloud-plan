    title: 365天续期码
    enabled: false
    entrypoint: STANDALONE_WEB
    price: {unit: CNY_FEN, amount: null}
    delivery: SINGLE_USE_CODE
    sales_limit_total: 5
    eligibility: [EXISTING_MEMBER, FUTURE_CAPACITY_CHECKED]
    effect: {type: EXEMPT_PLAYBACK, duration_days: 365, includes_registration: false}
